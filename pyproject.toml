[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seslisozluk-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Sesli Sözlük (Türkiye's multilingual dictionary since 1999) — word lookup, translations, pronunciations, word of the day"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
    "requests>=2.32",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
seslisozluk-mcp = "seslisozluk_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seslisozluk_mcp"]
